<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wall of Fame - Join Event</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- SDK Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 relative overflow-x-hidden">

  <div class="max-w-md w-full bg-slate-900/80 backdrop-blur-xl rounded-2xl p-6 shadow-2xl border border-slate-800 relative z-10 space-y-6">
    <div class="text-center space-y-1">
      <h2 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 to-pink-500">
        Wall of Fame
      </h2>
      <p class="text-xs text-slate-400">Abadikan foto kamu & tampil langsung di layar utama!</p>
    </div>

    <form id="registrationForm" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Nama Lengkap</label>
        <input type="text" id="fullName" required class="w-full px-4 py-3 rounded-xl bg-slate-800/90 border border-slate-700/80 text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500" placeholder="Masukkan nama kamu">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Email</label>
        <input type="email" id="email" required class="w-full px-4 py-3 rounded-xl bg-slate-800/90 border border-slate-700/80 text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500" placeholder="nama@email.com">
      </div>

      <div class="pt-2">
        <input type="file" id="cameraInput" accept="image/*" capture="user" class="hidden">
        <button type="button" onclick="document.getElementById('cameraInput').click()" class="w-full py-4 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 rounded-xl font-bold text-white shadow-lg flex items-center justify-center gap-2">
          📸 Ambil Foto Sekarang
        </button>
      </div>
    </form>

    <!-- ELEMEN CANVAS INI WAJIB ADA BIAR GAK ERROR -->
    <canvas id="photoCanvas" class="hidden"></canvas>
  </div>

  <!-- MODAL PREVIEW HASIL FOTO -->
  <div id="previewModal" class="fixed inset-0 bg-black/85 backdrop-blur-md flex items-center justify-center p-4 hidden z-50">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 max-w-sm w-full text-center space-y-4 shadow-2xl">
      <h3 class="text-lg font-bold text-indigo-400">Preview Foto Kamu</h3>
      <img id="modalPreviewImage" class="w-full aspect-square object-cover rounded-xl border border-slate-700">
      <div class="grid grid-cols-2 gap-3 pt-2">
        <button type="button" id="retakeBtn" class="py-3 bg-slate-800 rounded-xl text-xs font-semibold text-slate-300">🔄 Foto Ulang</button>
        <button type="button" id="confirmSubmitBtn" class="py-3 bg-indigo-600 rounded-xl text-xs font-bold text-white">🚀 Tayangkan!</button>
      </div>
    </div>
  </div>

  <!-- SCRIPT DITARUH DI PALING BAWAH SEBELUM CLOSING BODY -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // MASUKKAN URL & ANON KEY SUPABASE
      const SUPABASE_URL = "https://vaatfevtoftzsupcorht.supabase.co";
      const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZhYXRmZXZ0b2Z0enN1cGNvcmh0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI4NjAzMDAsImV4cCI6MjEwODQzNjMwMH0.d4PQVlLdy-SEexpmok51D8qxpMG8jpOm4WNMymkv64c";

      
      const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      const cameraInput = document.getElementById('cameraInput');
      const photoCanvas = document.getElementById('photoCanvas');
      const ctx = photoCanvas ? photoCanvas.getContext('2d') : null;
      const previewModal = document.getElementById('previewModal');
      const modalPreviewImage = document.getElementById('modalPreviewImage');
      let finalBlob = null;

      function loadImage(src) {
        return new Promise((resolve, reject) => {
          const img = new Image();
          img.crossOrigin = "anonymous";
          img.onload = () => resolve(img);
          img.onerror = (err) => reject(err);
          img.src = src;
        });
      }

      if (cameraInput) {
        cameraInput.addEventListener('change', async (e) => {
          const file = e.target.files[0];
          if (!file) return;

          const fullName = document.getElementById('fullName').value;
          if (!fullName) {
            alert("Mohon isi Nama Lengkap terlebih dahulu!");
            cameraInput.value = "";
            return;
          }

          try {
            const userImgUrl = URL.createObjectURL(file);
            const [userImg, frameImg] = await Promise.all([
              loadImage(userImgUrl),
              loadImage('frame.png').catch(() => null)
            ]);

            photoCanvas.width = 1080;
            photoCanvas.height = 1080;

            ctx.drawImage(userImg, 0, 0, 1080, 1080);
            if (frameImg) ctx.drawImage(frameImg, 0, 0, 1080, 1080);

            photoCanvas.toBlob((blob) => {
              finalBlob = blob;
              modalPreviewImage.src = URL.createObjectURL(blob);
              previewModal.classList.remove('hidden');
            }, 'image/jpeg', 0.85);

          } catch (err) {
            alert("Gagal memproses foto: " + err.message);
          }
        });
      }

      document.getElementById('retakeBtn').addEventListener('click', () => {
        previewModal.classList.add('hidden');
        cameraInput.value = "";
        finalBlob = null;
        cameraInput.click();
      });

      document.getElementById('confirmSubmitBtn').addEventListener('click', async () => {
        if (!finalBlob) return;

        const submitBtn = document.getElementById('confirmSubmitBtn');
        submitBtn.disabled = true;
        submitBtn.innerText = "Mengunggah...";

        try {
          const fileName = `photo_${Date.now()}.jpg`;

          const { error: storageError } = await supabaseClient.storage
            .from('photo')
            .upload(fileName, finalBlob);

          if (storageError) throw storageError;

          const photoUrl = `${SUPABASE_URL}/storage/v1/object/public/photo/${fileName}`;

          const { error: dbError } = await supabaseClient
            .from('event_logs')
            .insert([{
              full_name: document.getElementById('fullName').value,
              email: document.getElementById('email').value,
              photo_url: photoUrl,
              is_displayed: true
            }]);

          if (dbError) throw dbError;

          alert("Berhasil! Foto kamu langsung ditayangkan di Wall of Fame.");
          
          previewModal.classList.add('hidden');
          document.getElementById('registrationForm').reset();
          cameraInput.value = "";
          finalBlob = null;

        } catch (err) {
          alert("Terjadi kesalahan: " + err.message);
        } finally {
          submitBtn.disabled = false;
          submitBtn.innerText = "🚀 Tayangkan!";
        }
      });
    });
  </script>
</body>
</html>
