<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LED Wall Display - Wall of Fame</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- SDK Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    @keyframes floatIn {
      0% { opacity: 0; transform: translateY(40px) scale(0.8); }
      70% { transform: translateY(-5px) scale(1.05); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 15px rgba(99, 102, 241, 0.4); }
      50% { box-shadow: 0 0 30px rgba(236, 72, 153, 0.8); }
    }
    .animate-float { animation: floatIn 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
    .glow-effect { animation: pulseGlow 2s infinite; }
  </style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col justify-between p-6 overflow-hidden relative">

  <!-- Background Glowing Orbs -->
  <div class="absolute top-10 left-1/4 w-96 h-96 bg-indigo-600/20 rounded-full blur-3xl -z-10"></div>
  <div class="absolute bottom-10 right-1/4 w-96 h-96 bg-pink-600/20 rounded-full blur-3xl -z-10"></div>

  <!-- Header -->
  <header class="text-center space-y-2 mb-6">
    <h1 class="text-4xl md:text-5xl font-black tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 via-purple-400 to-pink-500 uppercase drop-shadow-lg">
      WALL OF FAME
    </h1>
    <p class="text-xs md:text-sm text-indigo-300 tracking-wider uppercase">✨ Live Photo Stream ✨</p>
  </header>

  <!-- Grid Gallery Foto -->
  <main class="flex-1 flex items-center justify-center">
    <div id="galleryGrid" class="grid grid-cols-2 md:grid-cols-4 gap-6 w-full max-w-7xl">
      <!-- Card foto dimasukkan via JS -->
    </div>
  </main>

  <footer class="mt-6 text-center text-xs text-slate-600">
    <span>Realtime Display Powered by Supabase</span>
  </footer>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const SUPABASE_URL = "https://vaatfevtoftzsupcorht.supabase.co";
      const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZhYXRmZXZ0b2Z0enN1cGNvcmh0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI4NjAzMDAsImV4cCI6MjEwODQzNjMwMH0.d4PQVlLdy-SEexpmok51D8qxpMG8jpOm4WNMymkv64c";

      const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      const galleryGrid = document.getElementById('galleryGrid');

      // Fetch foto awal saat pertama kali dibuka
      async function loadInitialPhotos() {
        const { data, error } = await supabaseClient
          .from('event_logs')
          .select('*')
          .eq('is_displayed', true)
          .order('created_at', { ascending: false })
          .limit(16);

        if (error) {
          console.error("Gagal memuat foto:", error.message);
          return;
        }

        if (data && data.length > 0) {
          galleryGrid.innerHTML = '';
          data.forEach(item => renderCard(item));
        } else {
          galleryGrid.innerHTML = `
            <div class="col-span-full text-center py-20 space-y-3">
              <p class="text-2xl text-slate-500 font-light">Belum ada foto yang ditayangkan</p>
              <p class="text-sm text-indigo-400/60 animate-pulse">Scan QR Code dan jadi yang pertama!</p>
            </div>`;
        }
      }

      // Render foto dengan rasio 4:3
      function renderCard(item, isNew = false) {
        if (galleryGrid.querySelector('.col-span-full')) galleryGrid.innerHTML = '';

        const card = document.createElement('div');
        card.className = `group relative bg-slate-900/90 rounded-2xl p-2.5 border border-slate-800 shadow-2xl overflow-hidden transform hover:scale-105 transition-all duration-300 ${isNew ? 'animate-float glow-effect ring-2 ring-indigo-400' : ''}`;
        
        card.innerHTML = `
          <div class="relative overflow-hidden rounded-xl aspect-[4/3]">
            <img src="${item.photo_url}" class="w-full h-full object-cover transform group-hover:scale-110 transition duration-500" onerror="this.src='https://via.placeholder.com/400x300?text=Image+Error'">
            <div class="absolute bottom-0 inset-x-0 p-2 bg-gradient-to-t from-black/80 via-black/40 to-transparent text-xs text-center font-medium truncate text-slate-200">
              ${item.full_name || ''}
            </div>
          </div>
        `;

        if (isNew && galleryGrid.firstChild) {
          galleryGrid.insertBefore(card, galleryGrid.firstChild);
        } else {
          galleryGrid.appendChild(card);
        }
      }

      // Supabase Realtime Stream
      supabaseClient
        .channel('public:event_logs')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'event_logs' }, payload => {
          if (payload.new && payload.new.is_displayed) {
            renderCard(payload.new, true);
          }
        })
        .subscribe();

      loadInitialPhotos();
    });
  </script>
</body>
</html>
