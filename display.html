<!-- SDK Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  // 1. Masukkan URL & ANON KEY Supabase kamu
  const SUPABASE_URL = "https://vaatfevtoftzsupcorht.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZhYXRmZXZ0b2Z0enN1cGNvcmh0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI4NjAzMDAsImV4cCI6MjEwODQzNjMwMH0.d4PQVlLdy-SEexpmok51D8qxpMG8jpOm4WNMymkv64c";

  // 2. Gunakan nama variabel 'supabaseClient' agar tidak bentrok dengan objek bawaan SDK
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const galleryGrid = document.getElementById('galleryGrid');

  // Load foto pertama kali saat halaman dibuka
  async function loadInitialPhotos() {
    const { data, error } = await supabaseClient
      .from('event_logs')
      .select('*')
      .eq('is_displayed', true)
      .order('created_at', { ascending: false })
      .limit(16);

    if (error) {
      console.error("Gagal memuat foto:", error.message);
      return;
    }

    if (data && data.length > 0) {
      galleryGrid.innerHTML = '';
      data.forEach(item => renderCard(item));
    }
  }

  // Render card gambar ke grid
  function renderCard(item, isNew = false) {
    if (galleryGrid.querySelector('p')) galleryGrid.innerHTML = '';

    const card = document.createElement('div');
    card.className = `group relative bg-slate-900/90 rounded-2xl p-2.5 border border-slate-800 shadow-2xl overflow-hidden transform hover:scale-105 transition-all duration-300 ${isNew ? 'animate-float glow-effect ring-2 ring-indigo-400' : ''}`;
    
    card.innerHTML = `
      <div class="relative overflow-hidden rounded-xl aspect-square">
        <img src="${item.photo_url}" class="w-full h-full object-cover transform group-hover:scale-110 transition duration-500">
      </div>
    `;

    if (isNew && galleryGrid.firstChild) {
      galleryGrid.insertBefore(card, galleryGrid.firstChild);
    } else {
      galleryGrid.appendChild(card);
    }
  }

  // Realtime Listener dari Database Supabase
  supabaseClient
    .channel('public:event_logs')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'event_logs' }, payload => {
      if (payload.new.is_displayed) {
        renderCard(payload.new, true);
      }
    })
    .subscribe();

  loadInitialPhotos();
</script>
